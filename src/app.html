<!doctype html>
<html lang="pt">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Admin theme before first paint (see src/lib/admin/theme/theme.svelte.ts).
			(function () {
				if (!/^\/admin(\/|$)/.test(location.pathname)) return;
				var mode = 'system';
				try {
					mode = localStorage.getItem('nostos:admin-theme') || 'system';
				} catch (e) {}
				if (mode === 'system') {
					mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				}
				document.documentElement.setAttribute('data-ui-theme', mode);
			})();
		</script>
		<style>
			/* Matches --ui-bg-canvas in src/lib/admin/theme/nostos-theme.css */
			html[data-ui-theme='light'] body { background: #f6f7f6; color-scheme: light; }
			html[data-ui-theme='dark'] body { background: #080908; color-scheme: dark; }
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
